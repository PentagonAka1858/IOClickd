version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: pfg_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-pfg_db}
      MYSQL_USER: ${DB_USERNAME:-pfg_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pfg_password}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db_init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pfg_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Laravel Backend Service
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: pfg_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-pfg_db}
      DB_USERNAME: ${DB_USERNAME:-pfg_user}
      DB_PASSWORD: ${DB_PASSWORD:-pfg_password}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-base64:+wPWg6K6KLq0p5zC/ZLl0rG0K6K6KLq0p5zC/ZLl0rG0=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: http://localhost
      FRONTEND_URL: http://localhost
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - backend_storage:/app/storage
    networks:
      - pfg_network
    command: >
        sh -c "
            php artisan config:clear &&
            php artisan cache:clear &&
            php artisan migrate --force &&
            php artisan db:seed &&
            php artisan serve --host=0.0.0.0 --port=8000
        "

  # React Frontend Service
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: pfg_frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    command: >
      sh -c "npm run build && npm run preview -- --host 0.0.0.0 --port 4173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - ../frontend/dist:/app/dist
    networks:
      - pfg_network

  # Nginx Web Server
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: pfg_nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - pfg_network

volumes:
  db_data:
  backend_storage:

networks:
  pfg_network:
    driver: bridge
